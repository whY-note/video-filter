[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-filter"
version = "0.1.0"
description = "基于 Flask 的三路相机视频筛选工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
video-filter = "video_filter.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["video_filter*"]
namespaces = false

[tool.setuptools.package-data]
video_filter = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
